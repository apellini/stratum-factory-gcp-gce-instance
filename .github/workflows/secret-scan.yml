name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  gitleaks:
    name: Secret scan (gitleaks) — hard publish gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for baseline comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks (detect mode — full repo scan)
        run: |
          echo "## Secret Scan Report" >> "$GITHUB_STEP_SUMMARY"
          if gitleaks detect --source=. --config=.gitleaks.toml --redact 2>&1; then
            echo "✅ No secrets detected by gitleaks." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ gitleaks detected potential secrets. See logs above." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  gitleaks-negative-test:
    name: Secret scan negative test (scanner sanity check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Create file with a dummy secret (planted for test only)
        run: |
          mkdir -p /tmp/negative-test
          cat > /tmp/negative-test/planted_secret.env <<'EOF'
          # THIS IS A NEGATIVE TEST FILE — never committed to the repo
          GITHUB_TOKEN=ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ1234567890ab
          EOF

      - name: Verify gitleaks DETECTS the planted secret (must fail = test passes)
        run: |
          echo "## Secret Scan Negative Test" >> "$GITHUB_STEP_SUMMARY"
          if gitleaks detect --source=/tmp/negative-test --no-git 2>&1; then
            echo "❌ NEGATIVE TEST FAILED: gitleaks did not detect the planted secret." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ NEGATIVE TEST PASSED: gitleaks correctly detected the planted secret." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
